# Orbital configuration. Secrets never go in this file: they come from
# environment variables (GitHub repository secrets in CI). See README.md.

site:
  name: Orbital
  tagline: Spaceflight over you — passes, launches and planned orbits
  # Public URL of the deployed site. Notification links point here.
  url: https://aayushxl5.github.io/orbital/
  # Times in the weekly digest and Telegram posts use this zone.
  timezone: Asia/Kolkata
  # Whose sky the digest's "Look up" section covers (a city id below).
  digest_city: delhi

ntfy:
  server: https://ntfy.sh
  # Topics are <prefix>-<city id>, <prefix>-launches and <prefix>-weekly.
  # Anyone can read or post to an ntfy.sh topic, so keep the prefix unique.
  topic_prefix: orbital-59vmuy

telegram:
  # Public link to the channel the bot posts to, shown on the site. The bot
  # token and chat id come from TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
  channel_url: ""

alerts:
  horizon_hours: 48       # schedule alerts this far ahead (ntfy allows up to 72)
  lead_minutes: 10        # ping this long before the object comes into view
  min_elevation_deg: 10   # a pass starts and ends at this elevation
  min_peak_deg: 30        # only alert for passes that climb at least this high
  dark_sun_deg: -6        # the sky counts as dark once the Sun is this far down
  objects:
    - {norad: 25544, name: ISS}
    - {norad: 48274, name: Tiangong}
  flights:
    lead_minutes: 5
    min_peak_deg: 15

launches:
  reminders_minutes: [60, 10]
  # Launches that get reminders and a star in the digest.
  notable:
    rockets: [Starship, New Glenn, SLS, Neutron, LVM3, GSLV, PSLV, SSLV, Vikram, Agnibaan, Ariane 6, H3]
    countries: [IN]
    crewed: true

satellite_groups:
  - {id: stations, label: Space stations, color: "#ffd166", labels: true}
  - {id: visual, label: Bright satellites, color: "#8ecae6"}
  - {id: last-30-days, label: Launched in the last 30 days, color: "#ff8fab", default_on: false}

# Each city gets its own alert topic. Add yours and open a pull request.
cities:
  - {id: delhi, name: New Delhi, lat: 28.6139, lon: 77.2090, tz: Asia/Kolkata}
  - {id: mumbai, name: Mumbai, lat: 19.0760, lon: 72.8777, tz: Asia/Kolkata}
  - {id: bengaluru, name: Bengaluru, lat: 12.9716, lon: 77.5946, tz: Asia/Kolkata}
